plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services' // ফায়ারবেসের জন্য এটি প্রয়োজন
}

// Secrets stay out of Git: read them from local.properties (which is git-ignored)
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def imgbbApiKey = localProps.getProperty("IMGBB_API_KEY", "")

android {
    namespace 'com.example.findlink'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.findlink"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // imgbb API key comes from local.properties, never from source control
        buildConfigField "String", "IMGBB_API_KEY", "\"${imgbbApiKey}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // ডিফল্ট অ্যান্ড্রয়েড লাইব্রেরি
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation libs.activity.ktx

    // টেস্টিং লাইব্রেরি
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Firebase BoM - এটি সব ভার্সন ঠিক রাখে এবং কনফ্লিক্ট দূর করে
    implementation platform('com.google.firebase:firebase-bom:32.7.1')

    // Firebase Services (BoM থাকার কারণে এখানে আলাদা ভার্সন নাম্বার লাগবে না)
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'

    // Image Loading & UI
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0")
}